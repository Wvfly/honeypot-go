name: CI

# 只负责用项目自带的构建脚本交叉编译发布二进制（Linux / Windows，amd64 / arm64）。
# 脚本内部已设置 CGO_ENABLED=0 与产物魔数校验，CI 与本地开发者用的是同一份逻辑，
# 不会出现"本地过了 CI 挂了"的行为不一致。

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch: {}

# 同一分支/PR 的旧运行被新 push 取消，省 CI 分钟数
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-linux:
    name: build linux (${{ matrix.arch }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: pwsh scripts/build-linux.ps1 -Arch ${{ matrix.arch }}
        shell: pwsh
        run: ./scripts/build-linux.ps1 -Arch ${{ matrix.arch }}

      - name: 上传二进制
        uses: actions/upload-artifact@v4
        with:
          name: honeypot-linux-${{ matrix.arch }}
          path: |
            target/honeypot-linux-${{ matrix.arch }}
            target/ttyshow-linux-${{ matrix.arch }}
            target/dbquery-linux-${{ matrix.arch }}
          retention-days: 14
          if-no-files-found: error

  build-windows:
    name: build windows (${{ matrix.arch }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: pwsh scripts/build-win.ps1 -Arch ${{ matrix.arch }}
        shell: pwsh
        run: ./scripts/build-win.ps1 -Arch ${{ matrix.arch }}

      - name: 上传二进制
        uses: actions/upload-artifact@v4
        with:
          name: honeypot-windows-${{ matrix.arch }}
          path: |
            target/honeypot-windows-${{ matrix.arch }}.exe
            target/ttyshow-windows-${{ matrix.arch }}.exe
            target/dbquery-windows-${{ matrix.arch }}.exe
          retention-days: 14
          if-no-files-found: error

  release:
    name: publish release
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: 下载全部构建产物
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 列出待发布产物
        run: ls -lh dist

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
